<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 72" width="380" height="72" fill="none" style="font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;">
  <!-- Emblem Icon -->
  <g transform="translate(6, 6) scale(0.6)">
    <!-- Outer Architectural Compass Circle -->
    <circle cx="50" cy="50" r="44" stroke="#C5A059" stroke-width="1.8"/>
    <circle cx="50" cy="50" r="40" stroke="#1A1918" stroke-width="0.8" stroke-dasharray="2,3" opacity="0.35"/>
    
    <!-- Cardinal Marks -->
    <line x1="50" y1="3" x2="50" y2="8" stroke="#C5A059" stroke-width="1.8"/>
    <line x1="50" y1="92" x2="50" y2="97" stroke="#C5A059" stroke-width="1.8"/>
    <line x1="3" y1="50" x2="8" y2="50" stroke="#C5A059" stroke-width="1.8"/>
    <line x1="92" y1="50" x2="97" y2="50" stroke="#C5A059" stroke-width="1.8"/>

    <!-- Monogram LI -->
    <path d="M34 26V74H58" stroke="#1A1918" stroke-width="4.2" stroke-linecap="square" stroke-linejoin="miter"/>
    <path d="M66 33V74" stroke="#1A1918" stroke-width="4.2" stroke-linecap="square"/>
    <rect x="63" y="23" width="6" height="6" fill="#C5A059" transform="rotate(45 66 26)"/>
    <line x1="26" y1="74" x2="74" y2="74" stroke="#C5A059" stroke-width="1.2" opacity="0.8"/>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="78" y1="18" x2="78" y2="54" stroke="#D8CEBF" stroke-width="1"/>

  <!-- Brand Typography -->
  <g transform="translate(94, 0)">
    <!-- Main Wordmark -->
    <text x="0" y="34" fill="#1A1918" font-family="'Cinzel', 'Cormorant Garamond', serif" font-size="20" font-weight="700" letter-spacing="4.5">LI PROJETOS</text>
    
    <!-- Subtitle / Positioning -->
    <text x="0" y="50" fill="#78716C" font-size="8" font-weight="600" letter-spacing="2.8" text-transform="uppercase">ARQUITETURA &amp; DESIGN DE INTERIORES</text>
  </g>
</svg>